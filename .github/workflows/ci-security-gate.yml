name: CI Security & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-and-tests:
    name: Backend Security, Type & Test Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pyright bandit pytest pytest-asyncio pytest-mock httpx

      - name: Ruff Linter Check
        run: |
          ruff check backend/app backend/tests backend/scripts

      - name: Bandit AST Security Audit
        run: |
          bandit -r backend/app -ll

      - name: Pyright Type Check
        run: |
          pyright backend/app

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
          GITHUB_WEBHOOK_SECRET: "12345678901234567890123456789012"
          GITHUB_PAT: ghp_dummytesttoken12345678901234567890
          NEXTJS_REVALIDATE_SECRET: test_nextjs_revalidate_secret_1234567890
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          IP_HASH_PEPPER: test_pepper_key_12345678901234567890
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: development
          GITHUB_WEBHOOK_SECRET: "12345678901234567890123456789012"
          GITHUB_PAT: ghp_dummytesttoken12345678901234567890
          NEXTJS_REVALIDATE_SECRET: test_nextjs_revalidate_secret_1234567890
          TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          IP_HASH_PEPPER: test_pepper_key_12345678901234567890
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend Typecheck & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build
